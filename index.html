<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vitrine</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;1,9..144,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f0e8;
    --ink: #1a1410;
    --accent: #c8502a;
    --muted: #9e9183;
    --card: #fdfaf5;
    --border: #ddd5c4;
    --tag: #ede6d8;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    padding: 3rem 4rem 2rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 2rem;
    flex-wrap: wrap;
  }

  .brand {
    font-family: 'Fraunces', serif;
    font-size: clamp(2.2rem, 5vw, 3.8rem);
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.02em;
  }

  .brand span { color: var(--accent); }

  .header-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 0.4rem;
  }

  .header-meta {
    font-size: 0.8rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-weight: 500;
  }

  .sync-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.72rem;
    color: var(--muted);
    font-weight: 400;
    text-transform: none;
    letter-spacing: 0;
  }

  .sync-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
    transition: background 0.3s;
  }

  .sync-dot.ok   { background: #5cb85c; }
  .sync-dot.err  { background: var(--accent); }
  .sync-dot.spin { background: #f0a840; animation: pulse 1s infinite; }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* ── GRID ── */
  main {
    padding: 3rem 4rem 5rem;
    max-width: 1400px;
    margin: 0 auto;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 2px;
  }

  /* ── CARD ── */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    position: relative;
  }

  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 20px 40px rgba(26,20,16,0.12);
    z-index: 2;
  }

  .card-img {
    width: 100%;
    aspect-ratio: 4/3;
    object-fit: cover;
    display: block;
    background: var(--tag);
  }

  .card-img-placeholder {
    width: 100%;
    aspect-ratio: 4/3;
    background: var(--tag);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 2.5rem;
  }

  .card-body {
    padding: 1.4rem 1.4rem 1.2rem;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  .card-name {
    font-family: 'Fraunces', serif;
    font-size: 1.2rem;
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: -0.01em;
  }

  .card-desc {
    font-size: 0.85rem;
    color: var(--muted);
    line-height: 1.55;
    flex: 1;
  }

  .card-footer {
    padding: 0 1.4rem 1.4rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }

  .price {
    font-family: 'Fraunces', serif;
    font-size: 1.5rem;
    font-weight: 300;
    color: var(--ink);
    font-style: italic;
  }

  .btn-buy {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    background: var(--ink);
    color: #fdfaf5;
    text-decoration: none;
    font-size: 0.75rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 0.65rem 1.1rem;
    transition: background 0.2s, color 0.2s;
    white-space: nowrap;
  }

  .btn-buy:hover { background: var(--accent); }

  /* ── STATES ── */
  .state-box {
    grid-column: 1/-1;
    text-align: center;
    padding: 6rem 2rem;
    color: var(--muted);
  }

  .state-box .icon { font-size: 2.5rem; margin-bottom: 1rem; }
  .state-box .title {
    font-family: 'Fraunces', serif;
    font-size: 1.4rem;
    font-style: italic;
    margin-bottom: 0.5rem;
    color: var(--ink);
  }
  .state-box .sub { font-size: 0.85rem; line-height: 1.6; }
  .state-box .sub code {
    background: var(--tag);
    padding: 0.1rem 0.35rem;
    font-family: monospace;
    font-size: 0.8rem;
  }
  .state-box .btn-setup {
    margin-top: 1.5rem;
    display: inline-flex;
    background: var(--ink);
    color: #fdfaf5;
    border: none;
    padding: 0.7rem 1.4rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.8rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: background 0.2s;
  }
  .state-box .btn-setup:hover { background: var(--accent); }

  /* ── OVERLAY + PANEL ── */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(26,20,16,0.5);
    z-index: 200;
    backdrop-filter: blur(2px);
  }
  .overlay.open { display: block; }

  .panel {
    position: fixed;
    top: 0;
    right: -540px;
    width: min(540px, 100vw);
    height: 100dvh;
    background: var(--card);
    z-index: 300;
    display: flex;
    flex-direction: column;
    transition: right 0.35s cubic-bezier(.4,0,.2,1);
    overflow: hidden;
  }
  .panel.open { right: 0; }

  .panel-header {
    padding: 1.6rem 1.8rem 1.4rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .panel-title {
    font-family: 'Fraunces', serif;
    font-size: 1.4rem;
    font-weight: 700;
  }

  .panel-close {
    background: none;
    border: 1px solid var(--border);
    width: 34px; height: 34px;
    border-radius: 50%;
    font-size: 1rem;
    cursor: pointer;
    color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .panel-close:hover { background: var(--tag); }

  .panel-body {
    flex: 1;
    overflow-y: auto;
    padding: 1.8rem;
    display: flex;
    flex-direction: column;
    gap: 1.4rem;
  }

  /* ── FORM INSIDE PANEL ── */
  .field-group { display: flex; flex-direction: column; gap: 0.3rem; }

  .field-label {
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }

  .field-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 0.7rem 0.85rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.875rem;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s;
  }
  .field-input:focus { border-color: var(--ink); }

  .field-hint {
    font-size: 0.75rem;
    color: var(--muted);
    line-height: 1.5;
  }
  .field-hint a { color: var(--ink); }
  .field-hint code {
    background: var(--tag);
    padding: 0.1rem 0.3rem;
    font-family: monospace;
    font-size: 0.72rem;
  }

  .btn-primary {
    width: 100%;
    background: var(--ink);
    color: #fdfaf5;
    border: none;
    padding: 0.8rem 1rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.82rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-primary:hover { background: var(--accent); }

  .btn-danger {
    width: 100%;
    background: none;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 0.65rem 1rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.78rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .btn-danger:hover { background: var(--accent); color: #fdfaf5; }

  .divider {
    border: none;
    border-top: 1px dashed var(--border);
  }

  /* instructions box */
  .instr {
    background: var(--tag);
    border: 1px solid var(--border);
    padding: 1rem 1.1rem;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  .instr-title {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
  }

  .instr ol {
    padding-left: 1.1rem;
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
  }

  .instr li {
    font-size: 0.8rem;
    line-height: 1.5;
    color: var(--ink);
  }

  .instr li code {
    background: rgba(0,0,0,0.07);
    padding: 0.05rem 0.3rem;
    font-family: monospace;
    font-size: 0.72rem;
  }

  /* interval selector */
  .interval-row {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
  }

  .interval-btn {
    flex: 1;
    min-width: 56px;
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 0.5rem 0.4rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.78rem;
    font-weight: 500;
    cursor: pointer;
    text-align: center;
    transition: background 0.15s, border-color 0.15s;
    color: var(--ink);
  }

  .interval-btn:hover { background: var(--tag); }
  .interval-btn.active { background: var(--ink); color: #fdfaf5; border-color: var(--ink); }

  /* status strip */
  .status-strip {
    background: var(--tag);
    border: 1px solid var(--border);
    padding: 0.75rem 1rem;
    font-size: 0.78rem;
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }

  .status-row { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
  .status-label { color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; }
  .status-val { font-weight: 500; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    background: var(--ink);
    color: #fdfaf5;
    padding: 0.7rem 1.2rem;
    font-size: 0.8rem;
    font-weight: 500;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.25s, transform 0.25s;
    pointer-events: none;
    z-index: 400;
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  @media (max-width: 640px) {
    header, main { padding-left: 1.4rem; padding-right: 1.4rem; }
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="brand">Vi<span>trine</span></div>
  </div>
  <div class="header-right">
    <div class="header-meta" id="count-label"></div>
    <div class="sync-badge" id="sync-badge" style="display:none">
      <div class="sync-dot" id="sync-dot"></div>
      <span id="sync-text">—</span>
    </div>
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<!-- Overlay -->
<div class="overlay" id="overlay"></div>

<!-- Side Panel -->
<div class="panel" id="panel">
  <div class="panel-header">
    <span class="panel-title">Configurações</span>
    <button class="panel-close" id="panel-close">✕</button>
  </div>
  <div class="panel-body" id="panel-body"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'vitrine_config_v2';

// ── Config ────────────────────────────────────────────────────────
let config = loadConfig();
config.sheetUrl = 'https://docs.google.com/spreadsheets/d/1kED0CA_538Q8HJhMjP_KDDBmo7So0qZyX2KVGm0qPc8/edit?usp=sharing';

function loadConfig() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return { sheetUrl: 'https://docs.google.com/spreadsheets/d/1kED0CA_538Q8HJhMjP_KDDBmo7So0qZyX2KVGm0qPc8/edit?usp=sharing', interval: 60 };
}

function saveConfig() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
}

// ── Google Sheets URL → JSON URL (OpenSheet) ─────────────────────
function toJsonUrl(raw) {
  raw = raw.trim();
  const match = raw.match(/\/spreadsheets\/d\/([^\/]+)/);
  if (!match) throw new Error('URL inválida');
  const sheetId = match[1];
  return `https://opensheet.elk.sh/${sheetId}/Página1`;
}

// ── Normalize rows → product objects ─────────────────────────────
function normalizeRows(rows) {
  const MAP = {
    nome:'name', name:'name', produto:'name', title:'name', titulo:'name',
    descricao:'desc', descricão:'desc', desc:'desc', description:'desc', descr:'desc',
    preco:'price', preço:'price', price:'price', valor:'price', custo:'price',
    imagem:'img', img:'img', image:'img', foto:'img', thumbnail:'img', thumb:'img',
    link:'link', url:'link', compra:'link', href:'link', 'link de compra':'link'
  };

  return rows.map((row, i) => {
    const out = { id: i + 1, name: '', desc: '', price: '', img: '', link: '' };
    Object.entries(row).forEach(([k, v]) => {
      const norm = k.toLowerCase().trim()
        .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
        .replace(/\s+/g,' ');
      const key = MAP[norm];
      if (key) out[key] = String(v ?? '').trim();
    });
    return out;
  }).filter(p => p.name);
}

// ── Render Grid ───────────────────────────────────────────────────
function renderGrid(products) {
  const grid = document.getElementById('grid');
  const label = document.getElementById('count-label');
  grid.innerHTML = '';

  if (!config.sheetUrl) {
    grid.innerHTML = `
      <div class="state-box">
        <div class="icon">🔗</div>
        <div class="title">Nenhuma planilha conectada</div>
        <div class="sub">
          Conecte uma planilha do Google Sheets para exibir produtos.<br>
          Use o atalho <code>Ctrl+Shift+A</code> para abrir as configurações.
        </div>
        <button class="btn-setup" onclick="openPanel()">Configurar agora</button>
      </div>`;
    label.textContent = '';
    return;
  }

  if (!products || !products.length) {
    grid.innerHTML = `
      <div class="state-box">
        <div class="icon">📦</div>
        <div class="title">Nenhum produto encontrado</div>
        <div class="sub">
          Verifique se a planilha está publicada corretamente e contém as colunas esperadas:<br>
          <code>name</code>, <code>desc</code>, <code>price</code>, <code>img</code>, <code>link</code>
        </div>
      </div>`;
    label.textContent = '';
    return;
  }

  label.textContent = products.length + (products.length === 1 ? ' produto' : ' produtos');

  products.forEach(p => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      ${p.img
        ? `<img class="card-img" src="${esc(p.img)}" alt="${esc(p.name)}" loading="lazy">`
        : `<div class="card-img-placeholder">🖼️</div>`
      }
      <div class="card-body">
        <div class="card-name">${esc(p.name)}</div>
        ${p.desc ? `<div class="card-desc">${esc(p.desc)}</div>` : ''}
      </div>
      <div class="card-footer">
        <div class="price">${esc(p.price)}</div>
        ${p.link
          ? `<a class="btn-buy" href="${esc(p.link)}" target="_blank" rel="noopener">Comprar →</a>`
          : ''
        }
      </div>
    `;
    grid.appendChild(card);
  });
}

// ── Sync ──────────────────────────────────────────────────────────
let syncTimer = null;
let lastSync = null;

async function fetchProducts() {
  if (!config.sheetUrl) return;

  setSyncState('spin', 'Atualizando…');

  try {
    const url = toJsonUrl(config.sheetUrl);

    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const data = await res.json();
    const products = normalizeRows(data);

    renderGrid(products);

    lastSync = new Date();

    setSyncState(
      'ok',
      'Atualizado ' +
      lastSync.toLocaleTimeString('pt-BR', {
        hour:'2-digit',
        minute:'2-digit'
      })
    );

    updateStatusStrip();

  } catch(err) {
    console.error('[Vitrine] Sync error:', err);
    setSyncState('err', 'Erro ao sincronizar');
  }
}

function setSyncState(state, text) {
  const badge = document.getElementById('sync-badge');
  const dot   = document.getElementById('sync-dot');
  const label = document.getElementById('sync-text');
  badge.style.display = 'inline-flex';
  dot.className = 'sync-dot ' + state;
  label.textContent = text;
}

function startSync() {
  clearInterval(syncTimer);
  fetchProducts();
  if (config.interval > 0) {
    syncTimer = setInterval(fetchProducts, config.interval * 1000);
  }
}

function updateStatusStrip() {
  const el = document.getElementById('status-last');
  if (el && lastSync) el.textContent = lastSync.toLocaleString('pt-BR');
}

// ── Panel ─────────────────────────────────────────────────────────
function renderPanel() {
  const body = document.getElementById('panel-body');

  const intervals = [
    { label: '30s', val: 30 },
    { label: '1min', val: 60 },
    { label: '2min', val: 120 },
    { label: '5min', val: 300 },
    { label: 'Manual', val: 0 },
  ];

  body.innerHTML = `
    <!-- Instructions -->
    <div class="instr">
      <div class="instr-title">Como conectar o Google Sheets</div>
      <ol>
        <li>Abra sua planilha no Google Sheets</li>
        <li>Certifique-se que as colunas têm os nomes:<br>
          <code>name</code>, <code>desc</code>, <code>price</code>, <code>img</code>, <code>link</code></li>
        <li>Menu <strong>Arquivo → Compartilhar → Publicar na web</strong></li>
        <li>Compartilhe a planilha como <strong>Qualquer pessoa com o link</strong></li>
        <li>Copie a URL normal da planilha e cole abaixo</li>
      </ol>
    </div>

    <!-- URL field -->
    <div class="field-group">
      <div class="field-label">URL da planilha</div>
      <input class="field-input" id="f-url" type="url"
        placeholder="https://docs.google.com/spreadsheets/d/…"
        value="${esc(config.sheetUrl)}">
      <div class="field-hint">
        Aceita URLs de edição, visualização ou link de publicação CSV do Google Sheets.
      </div>
    </div>

    <!-- Interval -->
    <div class="field-group">
      <div class="field-label">Intervalo de atualização</div>
      <div class="interval-row" id="interval-row">
        ${intervals.map(iv => `
          <button class="interval-btn ${config.interval === iv.val ? 'active' : ''}"
            data-val="${iv.val}">${iv.label}</button>
        `).join('')}
      </div>
    </div>

    <hr class="divider">

    <!-- Save -->
    <button class="btn-primary" id="btn-save">Salvar e sincronizar</button>

    <!-- Status -->
    <div class="status-strip" id="status-strip" style="${config.sheetUrl ? '' : 'display:none'}">
      <div class="status-row">
        <span class="status-label">Última sincronização</span>
        <span class="status-val" id="status-last">${lastSync ? lastSync.toLocaleString('pt-BR') : '—'}</span>
      </div>
      <div class="status-row">
        <span class="status-label">Intervalo ativo</span>
        <span class="status-val">${config.interval ? config.interval + 's' : 'Manual'}</span>
      </div>
    </div>

    <button class="btn-primary" id="btn-force" style="${config.sheetUrl ? '' : 'display:none'}">
      ↺ Sincronizar agora
    </button>

    ${config.sheetUrl ? `<hr class="divider"><button class="btn-danger" id="btn-disconnect">Desconectar planilha</button>` : ''}
  `;

  // Interval toggle
  body.querySelectorAll('.interval-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      body.querySelectorAll('.interval-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  // Save
  document.getElementById('btn-save').addEventListener('click', () => {
    const url = document.getElementById('f-url').value.trim();
    const activeBtn = body.querySelector('.interval-btn.active');
    const interval = activeBtn ? parseInt(activeBtn.dataset.val) : 60;

    if (!url) { toast('Cole a URL da planilha ✕'); return; }

    config.sheetUrl = url;
    config.interval = interval;
    saveConfig();
    closePanel();
    startSync();
    toast('Configurações salvas ✓');
  });

  // Force sync
  const btnForce = document.getElementById('btn-force');
  if (btnForce) btnForce.addEventListener('click', () => { fetchProducts(); toast('Sincronizando…'); });

  // Disconnect
  const btnDisc = document.getElementById('btn-disconnect');
  if (btnDisc) btnDisc.addEventListener('click', () => {
    if (!confirm('Desconectar a planilha? Os produtos deixarão de ser exibidos.')) return;
    config.sheetUrl = '';
    saveConfig();
    clearInterval(syncTimer);
    document.getElementById('sync-badge').style.display = 'none';
    renderGrid([]);
    closePanel();
    toast('Planilha desconectada');
  });
}

function openPanel() {
  renderPanel();
  document.getElementById('panel').classList.add('open');
  document.getElementById('overlay').classList.add('open');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}

document.getElementById('panel-close').addEventListener('click', closePanel);
document.getElementById('overlay').addEventListener('click', closePanel);

// Secret shortcut: Ctrl + Shift + A
document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.shiftKey && e.key === 'A') { e.preventDefault(); openPanel(); }
});

// ── Toast ─────────────────────────────────────────────────────────
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

// ── Helpers ───────────────────────────────────────────────────────
function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Init ──────────────────────────────────────────────────────────
if (config.sheetUrl) {
  startSync();
} else {
  renderGrid([]);
}
</script>
</body>
